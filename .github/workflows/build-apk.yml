name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Misma llave de firma en cada compilación, para poder actualizar sin desinstalar.
      # Se guarda en la caché privada de Actions (no se publica con el código).
      - name: Llave de firma persistente
        uses: actions/cache@v4
        with:
          path: ~/st-signing/app.jks
          key: signing-keystore-v2

      - name: Crear llave si no existe
        run: |
          mkdir -p ~/st-signing
          if [ ! -f ~/st-signing/app.jks ]; then
            keytool -genkeypair -noprompt -keystore ~/st-signing/app.jks -storepass screentr -keypass screentr \
              -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Screen Translator"
          fi
          echo "ST_KEYSTORE=$HOME/st-signing/app.jks" >> "$GITHUB_ENV"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ScreenTranslator-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ScreenTranslator-arm32.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: ScreenTranslator-*.apk

      - name: Publicar en Releases (descarga directa)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: Screen Translator v2.3.${{ github.run_number }}
          make_latest: true
          files: ScreenTranslator-*.apk
          body: |
            APK listo para instalar en Android 11 o superior.
            - **ScreenTranslator-arm64.apk** → casi todos los teléfonos (2017 en adelante). Use este.
            - **ScreenTranslator-arm32.apk** → solo teléfonos muy viejos o de gama muy baja.
