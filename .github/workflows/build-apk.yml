name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ScreenTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: ScreenTranslator.apk

      - name: Publicar en Releases (descarga directa)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Screen Translator v2.0.${{ github.run_number }}
          make_latest: true
          files: ScreenTranslator.apk
          body: |
            APK listo para instalar en Android 11 o superior.
            Descargue **ScreenTranslator.apk** abajo, en "Assets".
