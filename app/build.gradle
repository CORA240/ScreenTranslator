plugins {
    id 'com.android.application'
}

android {
    namespace 'com.balor.screentranslator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.balor.screentranslator'
        minSdk 30          // Android 11+: captura de pantalla desde el servicio de accesibilidad
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma el release con la llave de depuración para que el APK sea instalable directamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OCR sin conexión (alfabeto latino), modelo incluido dentro del APK
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Traducción sin conexión (descarga el modelo de idioma la primera vez)
    implementation 'com.google.mlkit:translate:17.0.3'
}
