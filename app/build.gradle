plugins {
    id 'com.android.application'
}

android {
    namespace 'com.balor.screentranslator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.balor.screentranslator'
        minSdk 30          // Android 11+: captura de pantalla desde el servicio de accesibilidad
        targetSdk 34
        versionCode 5
        versionName '2.3'
    }

    signingConfigs {
        // Llave fija creada por GitHub Actions (ver .github/workflows). Sin ella, usa la de depuración.
        stable {
            storeFile System.getenv('ST_KEYSTORE') ? file(System.getenv('ST_KEYSTORE')) : null
            storePassword 'screentr'
            keyAlias 'app'
            keyPassword 'screentr'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ST_KEYSTORE') ? signingConfigs.stable : signingConfigs.debug
        }
    }

    // Un APK por tipo de procesador para que pese menos (los teléfonos usan ARM).
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OCR sin conexión (alfabeto latino), modelo incluido dentro del APK
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Traducción sin conexión (descarga el modelo de idioma la primera vez)
    implementation 'com.google.mlkit:translate:17.0.3'
}
